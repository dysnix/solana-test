[[receiver]]
pubkey = ""
private_key = "receiver_pk.json"

[[sender]]
pubkey = ""
private_key = "sender_pk.json"

[[global]]
tip_amount = 1000000
# Compute budget for the benchmarked transfer (transfer + memo + tip ix).
# Memo program alone burns ~5-12k CU for short memos; 100k leaves headroom.
compute_unit_limit = 100000
compute_unit_price_micro_lamports = 100000
rpc_url = "https://solana-rpc.rpcfast.com/?api_key="
# Primary gRPC endpoint. When grpc_tracking_url is unset it carries slots,
# transactions and blocks; when set it carries blocks only (since Aperture does
# not expose a blocks subscription).
grpc_url = "https://yellowstone-grpc.example.com"
# grpc_x_token = ""
# Optional faster endpoint for slots + transactions (e.g. rpcfast Aperture gRPC,
# ~30-40ms ahead of vanilla Yellowstone since it decodes from shreds).
# grpc_tracking_url = "https://aperture-grpc.rpcfast.com"
# grpc_tracking_x_token = ""

[[provider]]
name = "rpcfast-astralane"
# Optional overrides for global defaults:
# rpc_url = "https://custom-rpc-url-for-this-provider"
# tip_amount = 1500000
# compute_unit_limit = 12000
# compute_unit_price_micro_lamports = 200000
# Optional sender override for parallel provider isolation.
# Set both fields together when overriding:
# sender_pubkey = "..."
# sender_private_key = "provider_sender_pk.json"
send_tx_rpc_url = "https://beam.rpcfast.com/?provider=astralane&mode=fastest&api_key="
